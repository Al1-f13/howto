
<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Soccer Game</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        overflow-x: hidden;
      }
      canvas {
        display: block;
        position: relative;
      }
      .player {
        position: absolute;
        top: 50px;
        left: 50px;
        width: 50px;
        height: 50px;
        border-radius: 50%;
        background-color: #fff;
        z-index: 1;
      }
      .ball {
        position: absolute;
        top: 50px;
        left: 50px;
        width: 50px;
        height: 50px;
        border-radius: 50%;
        background-color: #fff;
        z-index: 0;
      }
      .score {
        position: absolute;
        top: 50px;
        left: 50px;
        width: 100px;
        height: 50px;
        font-size: 24px;
        font-weight: bold;
        background-color: #fff;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas" width="800" height="600"></canvas>
    <script src="script.js"></script>
  </body>
</html>
